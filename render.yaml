services:
  - type: web
    name: fittrack-backend
    runtime: node
    plan: free
    region: oregon
    buildCommand: cd backend && npm install && npx prisma generate
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: fittrack-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
    healthCheckPath: /api/health

databases:
  - name: fittrack-postgres
    plan: free
    region: oregon
    databaseName: fittrack_db
    user: fittrack_user
